{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>数据备份</h1><form method="post" action="{{ url_for('main.backup_create') }}"><button class="btn btn-primary">手动备份</button></form></div>
<div class="table-responsive"><table class="table table-hover align-middle">
<thead><tr><th>文件</th><th>大小</th><th>时间</th><th>操作</th></tr></thead>
<tbody>{% for item in items %}<tr><td>{{ item.name }}</td><td>{{ (item.size / 1024)|round(1) }} KB</td><td>{{ item.mtime.strftime("%Y-%m-%d %H:%M:%S") }}</td><td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('main.backup_download', name=item.name) }}">下载</a></td></tr>{% else %}<tr><td colspan="4" class="text-secondary">暂无备份</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock %}
