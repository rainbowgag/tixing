<!doctype html>
<html lang="zh-CN" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "跨境直播线路客户管理系统" }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">线路客户管理</div>
    <nav class="nav flex-column">
      <a class="nav-link" href="{{ url_for('main.dashboard') }}">仪表盘</a>
      <a class="nav-link" href="{{ url_for('main.customers') }}">客户管理</a>
      <a class="nav-link" href="{{ url_for('main.devices') }}">设备管理</a>
      <a class="nav-link" href="{{ url_for('main.lines') }}">线路管理</a>
      <a class="nav-link" href="{{ url_for('main.remotes') }}">远程管理</a>
      <a class="nav-link" href="{{ url_for('main.renewals') }}">续费管理</a>
      <a class="nav-link" href="{{ url_for('main.search') }}">全局搜索</a>
      <a class="nav-link" href="{{ url_for('main.backups') }}">数据备份</a>
      <a class="nav-link" href="{{ url_for('auth.change_password') }}">修改密码</a>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <form class="searchbar" action="{{ url_for('main.search') }}">
        <input class="form-control" name="q" placeholder="搜索客户、设备、线路、远程地址、备注">
      </form>
      <button class="btn btn-outline-secondary btn-sm" id="themeToggle" type="button">深色</button>
      <a class="btn btn-outline-danger btn-sm" href="{{ url_for('auth.logout') }}">退出</a>
    </header>
    <section class="content">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
