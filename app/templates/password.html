{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>修改密码</h1></div>
<form class="form-panel" method="post">
  <label class="form-label">原密码</label><input class="form-control mb-3" type="password" name="old_password" required>
  <label class="form-label">新密码</label><input class="form-control mb-3" type="password" name="new_password" required>
  <label class="form-label">确认新密码</label><input class="form-control mb-4" type="password" name="confirm" required>
  <button class="btn btn-primary">保存</button>
</form>
{% endblock %}
