{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>{{ "编辑续费记录" if item.id else "新增续费记录" }}</h1></div>
<form class="form-panel" method="post">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">客户</label><select class="form-select" name="customer_id" required>{% for c in customers %}<option value="{{ c.id }}" {% if item.customer_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">设备</label><select class="form-select" name="device_id"><option value="">未选择</option>{% for d in devices %}<option value="{{ d.id }}" {% if item.device_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div>
    <div class="col-md-4"><label class="form-label">线路</label><select class="form-select" name="line_id"><option value="">未选择</option>{% for l in lines %}<option value="{{ l.id }}" {% if item.line_id==l.id %}selected{% endif %}>{{ l.code }}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">价格</label><input class="form-control" name="price" type="number" step="0.01" value="{{ item.price or 0 }}"></div>
    <div class="col-md-3"><label class="form-label">开通时间</label><input class="form-control" name="start_date" type="date" value="{{ item.start_date or '' }}"></div>
    <div class="col-md-3"><label class="form-label">到期时间</label><input class="form-control" name="expire_date" type="date" value="{{ item.expire_date or '' }}" required></div>
    <div class="col-md-3"><label class="form-label">状态</label><select class="form-select" name="status">{% for s in ["正常","即将到期","已到期","已续费"] %}<option {% if item.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
    <div class="col-12"><label class="form-label">备注</label><textarea class="form-control" name="remark" rows="4">{{ item.remark or '' }}</textarea></div>
  </div>
  <button class="btn btn-primary mt-4">保存</button>
</form>
{% endblock %}
