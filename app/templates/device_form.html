{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>{{ "编辑设备" if item.id else "新增设备" }}</h1></div>
<form class="form-panel" method="post">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">设备名称</label><input class="form-control" name="name" value="{{ item.name or '' }}" required></div>
    <div class="col-md-6"><label class="form-label">所属客户</label><select class="form-select" name="customer_id"><option value="">未选择</option>{% for c in customers %}<option value="{{ c.id }}" {% if item.customer_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">国家</label><input class="form-control" name="country" value="{{ item.country or '' }}"></div>
    <div class="col-md-6"><label class="form-label">设备类型</label><input class="form-control" name="device_type" value="{{ item.device_type or '' }}"></div>
    <div class="col-12"><label class="form-label">备注</label><textarea class="form-control" name="remark" rows="4">{{ item.remark or '' }}</textarea></div>
  </div>
  <button class="btn btn-primary mt-4">保存</button>
</form>
{% endblock %}
